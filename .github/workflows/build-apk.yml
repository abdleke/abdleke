name: Build Android APK & iOS IPA

on:
  push:
    branches:
      - claude/association-finance-app-diowtw
      - main
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Add Android platform
        working-directory: app
        run: flutter create --platforms android .

      - name: Ensure INTERNET permission in AndroidManifest
        working-directory: app
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          echo "=== Manifest avant patch ==="
          cat "$MANIFEST"
          python3 -c "
import re
with open('$MANIFEST') as f:
    c = f.read()
if 'INTERNET' not in c:
    c = re.sub(r'(<manifest\b[^>]*>)', r'\1\n    <uses-permission android:name=\"android.permission.INTERNET\"/>', c)
    with open('$MANIFEST', 'w') as f:
        f.write(c)
    print('INTERNET permission ajoutée')
else:
    print('INTERNET permission déjà présente')
"

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK (release)
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: jamiyati-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  ios:
    name: iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Add iOS platform
        working-directory: app
        run: flutter create --platforms ios .

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Build iOS archive (no codesign)
        working-directory: app
        run: flutter build ipa --no-codesign

      - name: Package IPA from xcarchive
        working-directory: app
        run: |
          ARCHIVE=build/ios/archive/Runner.xcarchive
          mkdir -p build/ios/ipa/Payload
          cp -r "$ARCHIVE/Products/Applications/Runner.app" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r jamiyati.ipa Payload
          echo "IPA created: $(du -sh jamiyati.ipa)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: jamiyati-ipa
          path: app/build/ios/ipa/jamiyati.ipa
          retention-days: 30
